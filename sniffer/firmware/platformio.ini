; Oscilloscope-style sampler for the Bosch Therm 5600 O 2-wire remote bus,
; ESP32 DevKit (WROOM-32), streaming over Wi-Fi.
; Flash from this folder with `pio run -t upload`.
; This board's auto-reset does not enter download mode, so esptool must not
; reset it: first hold BOOT, tap EN, release BOOT, then upload.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_upload.before_reset = no_reset
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.16
